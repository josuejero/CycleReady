name: QA Evidence

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  qa-evidence:
    name: build, test, and collect evidence
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run qa:validate
      - run: npm run test:unit
      - run: npm run coverage
      - run: npm run build
      - run: npm run test:e2e:ci
      - run: npm run metrics
      - run: npm run audit:lighthouse

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

      - name: Upload QA metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-metrics
          path: reports/latest
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage
          retention-days: 30

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: reports/lighthouse
          retention-days: 30

      - name: Upload production build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 30
