name: Defect report
description: Capture triage-ready CycleReady defect information.
title: "[Defect]: "
labels:
  - defect
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for defects found during manual QA, UAT, smoke testing, regression testing, or portfolio review.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Brief outcome-focused headline.
      placeholder: Dashboard credit total is wrong after metadata upload.
    validations:
      required: true

  - type: dropdown
    id: workflow-area
    attributes:
      label: Workflow area
      options:
        - Dashboard
        - Log CME
        - History
        - Reminders
        - Upload Support
        - Reviewer Actions
        - Release Room
        - Release Summary
        - Documentation
        - CI/CD
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Sev1 - Blocker
        - Sev2 - Critical
        - Sev3 - Major
        - Sev4 - Minor
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P1 - Fix now
        - P2 - Fix before next release
        - P3 - Fix in a future release
        - P4 - Informational
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use numbered steps and include test data when relevant.
      placeholder: |
        1. Open the dashboard.
        2. Upload metadata for an activity with an overdue reminder.
        3. Return to the reminders panel.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: input
    id: requirement-id
    attributes:
      label: Requirement ID
      placeholder: RQ-003
    validations:
      required: false

  - type: input
    id: test-case-id
    attributes:
      label: Test case or automation ID
      placeholder: TC-003 or PW-REG-004
    validations:
      required: false

  - type: dropdown
    id: found-in
    attributes:
      label: Found in
      options:
        - Manual functional test
        - Smoke automation
        - Regression automation
        - UAT
        - Accessibility review
        - Performance review
        - Documentation review
    validations:
      required: true

  - type: dropdown
    id: repro-rate
    attributes:
      label: Repro rate
      options:
        - Always
        - Intermittent
        - Rare
    validations:
      required: true

  - type: dropdown
    id: release-blocker
    attributes:
      label: Release blocker
      options:
        - Yes
        - No
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add screenshots, logs, trace links, or Playwright report references.
      placeholder: Screenshot or report link goes here.
    validations:
      required: false
